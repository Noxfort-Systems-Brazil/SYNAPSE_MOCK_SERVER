[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-mock-server"
version = "1.2.0"
description = "High-Frequency Telemetry (HFT) Client Test Harness & Traffic Simulator for the Synapse protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Moraes", email = "gabriel.moraes@noxfortsystems.com" },
]
keywords = [
    "synapse",
    "hft",
    "telemetry",
    "traffic-simulator",
    "grpc",
    "carina",
    "noxfort",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing :: Traffic Simulation",
]
dependencies = [
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "grpcio-tools>=1.62.0",
]

[project.scripts]
synapse-mock = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ui*", "proto*", "interfaces*", "infrastructure*"]

[tool.setuptools]
py-modules = ["main", "interfaces"]

