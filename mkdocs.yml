# ==============================================================================
# SYNAPSE MOCK SERVER — MkDocs Configuration (Material for MkDocs)
# High-Frequency Telemetry & Synapse Protocol Test Harness
# Copyright (C) 2026 — Noxfort Systems
# ==============================================================================

site_name: "SYNAPSE MOCK SERVER — Technical Documentation"
site_description: "Internal technical documentation for SYNAPSE MOCK SERVER — High-Frequency Telemetry & Synapse Protocol Test Harness of the Noxfort ecosystem."
site_author: "Gabriel Moraes — Noxfort Systems"
copyright: "Copyright &copy; 2026 — Noxfort Systems"

# ==============================================================================
# Theme
# ==============================================================================
theme:
  name: material
  language: en
  icon:
    logo: material/server-network
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark Mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# ==============================================================================
# Markdown Extensions
# ==============================================================================
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# ==============================================================================
# Plugins
# ==============================================================================
plugins:
  - search

